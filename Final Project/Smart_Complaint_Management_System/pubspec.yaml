name: smart_complaint_management
description: A Flutter app for managing student complaints in the CS department.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^1.10.0
  go_router: ^14.0.0
  provider: ^6.0.0
  excel: ^2.0.0
  file_picker: ^8.0.3
  uuid: ^3.0.0
  http: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.0

flutter:
  uses-material-design: true
